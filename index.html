<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Dória — Currículo</title>
  <meta name="description" content="Currículo de David Dória (MiniProj1, SPA em Vue.js).">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <style>
    :root {
      --papel: #f6f6f3;
      --branco: #fff;
      --tinta: #16181b;
      --cinza: #5e6268;
      --regua: #dcdcd5;
      --laranja: #d9480f;
      --sans: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--papel);
      color: var(--tinta);
      font: 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* A aplicação ocupa exatamente a janela: cabeçalho e rodapé fixos,
       e o conteúdo de cada página ajusta-se ao espaço do meio. */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    a { color: inherit; }
    ::selection { background: var(--laranja); color: #fff; }
    :focus-visible { outline: 2px solid var(--laranja); outline-offset: 3px; }

    .largura { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 40px; }

    /* ---------- topo ---------- */
    .topo { flex: none; border-bottom: 1px solid var(--regua); }
    .topo .largura {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px 32px; padding-top: 14px; padding-bottom: 14px;
    }
    .assinatura { display: flex; align-items: center; gap: 12px; font-weight: 600; text-decoration: none; }
    .monograma {
      display: grid; place-items: center; width: 38px; height: 38px;
      border: 2px solid var(--tinta); font: 500 .95rem var(--mono);
      transition: background .15s, color .15s;
    }
    .assinatura:hover .monograma { background: var(--tinta); color: var(--papel); }

    .menu { display: flex; flex-wrap: wrap; gap: 4px 28px; }
    .menu a { position: relative; padding: 4px 0; color: var(--cinza); text-decoration: none; }
    .menu a:hover { color: var(--tinta); }
    .menu small { margin-right: 6px; color: var(--laranja); font: .75rem var(--mono); }
    .menu a.router-link-exact-active { color: var(--tinta); }
    .menu a.router-link-exact-active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--laranja);
    }

    /* ---------- palco: a área entre o cabeçalho e o rodapé ---------- */
    main { display: flex; flex: 1; align-items: center; min-height: 0; overflow: hidden; }
    .palco { width: 100%; max-width: 1120px; margin: 0 auto; padding: 24px 40px; transform-origin: center center; }

    /* ---------- cabeçalho de cada página ---------- */
    .cabeca { margin-bottom: 28px; }
    .cabeca .num { color: var(--laranja); font: 500 .85rem var(--mono); }
    .cabeca h1 {
      margin: .1em 0 .2em; font-size: clamp(2.2rem, 4.5vw, 3rem); font-weight: 600;
      line-height: 1.05; letter-spacing: -.025em;
    }
    .lead { max-width: 52ch; margin: 0; color: var(--cinza); font-size: 1.15rem; }

    .colunas { display: grid; gap: 40px; align-items: start; }
    .colunas--2 { grid-template-columns: 1.5fr 1fr; }
    .colunas--3 { grid-template-columns: 1.3fr 1fr 1fr; }

    .rotulo { margin: 0 0 14px; color: var(--cinza); font: 500 .9rem var(--mono); }
    .rotulo::before { content: "// "; color: var(--laranja); }

    /* ---------- botões ---------- */
    .botao {
      display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px;
      border: 2px solid var(--tinta); background: var(--tinta); color: var(--papel);
      font: 500 .95rem var(--mono); text-decoration: none; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .botao:hover { background: var(--laranja); border-color: var(--laranja); color: #fff; }
    .botao--linha { background: transparent; color: var(--tinta); }
    .botao svg { width: 16px; height: 16px; fill: currentColor; }

    /* ---------- início ---------- */
    .inicio { display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: center; }
    .etiqueta { margin: 0 0 18px; color: var(--laranja); font: 500 .95rem var(--mono); }
    .nome-grande {
      margin: 0 0 24px; font-size: clamp(3.2rem, 8vw, 6.2rem); font-weight: 600;
      line-height: .92; letter-spacing: -.045em;
    }
    .nome-grande span { display: block; }
    .foto { width: 160px; aspect-ratio: 4 / 5; object-fit: cover; margin-bottom: 20px; border: 1px solid var(--tinta); filter: grayscale(1); }

    .indice { margin: 0 0 32px; padding: 0; list-style: none; border-top: 2px solid var(--tinta); }
    .indice a {
      display: flex; align-items: baseline; gap: 16px; padding: 16px 0;
      border-bottom: 1px solid var(--regua); text-decoration: none;
    }
    .indice .n { width: 2ch; color: var(--laranja); font: 500 .85rem var(--mono); }
    .indice .t { font-size: 1.4rem; font-weight: 600; letter-spacing: -.01em; transition: color .15s; }
    .indice .pontos { flex: 1; min-width: 24px; border-bottom: 2px dotted var(--regua); transform: translateY(-6px); transition: border-color .15s; }
    .indice .d { color: var(--cinza); font-size: .95rem; }
    .indice a:hover .t { color: var(--laranja); }
    .indice a:hover .pontos { border-color: var(--laranja); }

    /* ---------- quem sou eu ---------- */
    .texto p { margin: 0 0 1em; }
    .texto p:first-child { font-size: 1.15rem; }

    .ficha { border: 2px solid var(--tinta); background: var(--branco); }
    .ficha__titulo { margin: 0; padding: 8px 16px; background: var(--tinta); color: var(--papel); font: 500 .8rem var(--mono); }
    .ficha dl { margin: 0; }
    .ficha dl div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--regua); }
    .ficha dl div:last-child { border-bottom: 0; }
    .ficha dt { padding-top: 3px; color: var(--cinza); font: .8rem var(--mono); }
    .ficha dd { margin: 0; font-size: .95rem; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }

    /* linhas de formação e experiência */
    .linhas { margin: 0; padding: 0; list-style: none; }
    .linhas li { display: grid; grid-template-columns: 160px 1fr; gap: 2px 20px; padding: 10px 0; border-bottom: 1px solid var(--regua); line-height: 1.45; }
    .linhas li:first-child { padding-top: 0; }
    .linhas li:last-child { border-bottom: 0; }
    .linhas .datas { padding-top: 2px; color: var(--cinza); font: .82rem var(--mono); white-space: nowrap; }
    .linhas .agora .datas { color: var(--laranja); }
    .linhas strong { font-weight: 600; }
    .linhas .onde { color: var(--cinza); }
    .linhas p { margin: 2px 0 0; font-size: .92rem; }

    .linhas--empilhadas li { display: block; padding: 0 0 12px; margin-bottom: 12px; }
    .linhas--empilhadas li:last-child { margin-bottom: 0; padding-bottom: 0; }
    .linhas--empilhadas .datas { display: block; margin-bottom: 2px; }
    .linhas--empilhadas strong, .linhas--empilhadas .onde { display: block; }

    /* ---------- competências ---------- */
    .stack { margin: 0; }
    .stack div + div { margin-top: 16px; }
    .stack dt { margin-bottom: 6px; color: var(--cinza); }
    .stack dd { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
    .stack code { padding: 2px 8px; border: 1px solid var(--regua); border-radius: 3px; background: var(--branco); font: .85rem var(--mono); }

    /* ---------- hobbies: cartas ---------- */
    .cartas { display: grid; grid-template-columns: repeat(4, minmax(0, 230px)); justify-content: start; gap: 24px; }
    .carta {
      --cor: #333;
      position: relative; display: flex; flex-direction: column; aspect-ratio: 63 / 88; overflow: hidden;
      padding: 10px; border: 0; border-radius: 14px; background: var(--cor);
      color: var(--tinta); font: inherit; text-align: left; cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .15);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .carta:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 16px 32px rgba(0, 0, 0, .2); }
    .carta:nth-child(even):hover { transform: translateY(-6px) rotate(1deg); }
    .carta::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .35) 48%, transparent 62%);
      transform: translateX(-110%); transition: transform .7s ease;
    }
    .carta:hover::after { transform: translateX(110%); }

    .carta__topo, .carta__tipo, .carta__texto {
      background: #f3f1ea; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3);
    }
    .carta__topo {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; border-radius: 6px 6px 3px 3px; font-size: .95rem; font-weight: 600; line-height: 1.2;
    }
    .carta__custo {
      display: grid; flex: none; place-items: center; width: 22px; height: 22px; border-radius: 50%;
      background: var(--cor); color: #fff; font: 500 .75rem var(--mono);
    }
    .carta__arte {
      display: flex; flex: 1; align-items: center; justify-content: center; gap: 14px; margin: 6px 4px;
      border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4);
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .08) 0 6px, transparent 6px 12px),
        linear-gradient(160deg, rgba(255, 255, 255, .22), rgba(0, 0, 0, .3));
    }
    .carta__arte svg { width: 60px; height: 60px; fill: rgba(255, 255, 255, .92); filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); }
    .carta__arte svg + svg { width: 50px; }
    .carta__tipo { padding: 4px 10px; border-radius: 3px; font-size: .8rem; font-weight: 500; }
    .carta__texto {
      margin-top: 6px; padding: 10px; min-height: 66px; border-radius: 3px 3px 6px 6px;
      font-size: .9rem; font-style: italic; line-height: 1.4;
    }
    .carta__rodape {
      display: flex; justify-content: space-between; padding: 6px 4px 0;
      color: rgba(255, 255, 255, .85); font: .65rem var(--mono);
    }

    /* ---------- janela modal ---------- */
    .fundo {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(22, 24, 27, .6);
    }
    .janela {
      position: relative; width: 100%; max-width: 520px;
      padding: 32px; border-top: 6px solid var(--cor, var(--laranja)); background: var(--branco);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .25);
    }
    .janela .tipo { margin: 0 0 4px; color: var(--cinza); font: .8rem var(--mono); }
    .janela h2 { margin: 0 0 12px; font-size: 1.6rem; letter-spacing: -.01em; }
    .janela p { margin: 0 0 1em; }
    .janela .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .fechar {
      position: absolute; top: 10px; right: 10px; width: 36px; height: 36px;
      border: 0; background: none; color: var(--cinza); font-size: 1.6rem; line-height: 1; cursor: pointer;
    }
    .fechar:hover { color: var(--tinta); }

    /* ---------- rodapé ---------- */
    .rodape { flex: none; background: var(--tinta); color: #c9cbd0; }
    .rodape .largura {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 16px; padding-top: 16px; padding-bottom: 16px;
    }
    .rodape p { margin: 0; font: .85rem var(--mono); }
    .rodape p a { color: #fff; text-underline-offset: 3px; }
    .rodape p a:hover { color: var(--laranja); }
    .redes { display: flex; gap: 10px; }
    .redes a {
      display: grid; place-items: center; width: 40px; height: 40px;
      border: 1px solid #3a3d42; color: #e8e8e8; transition: background .15s, border-color .15s;
    }
    .redes a:hover { background: var(--laranja); border-color: var(--laranja); }
    .redes svg { width: 18px; height: 18px; fill: currentColor; }

    /* ---------- transições ---------- */
    .pagina-enter-active, .pagina-leave-active { transition: opacity .18s ease; }
    .pagina-enter-from, .pagina-leave-to { opacity: 0; }
    .modal-enter-active, .modal-leave-active { transition: opacity .2s ease; }
    .modal-enter-active .janela, .modal-leave-active .janela { transition: transform .2s ease; }
    .modal-enter-from, .modal-leave-to { opacity: 0; }
    .modal-enter-from .janela, .modal-leave-to .janela { transform: translateY(12px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

    /* ---------- ecrãs estreitos (telemóvel) ---------- */
    @media (max-width: 760px) {
      body { overflow: auto; }
      #app { height: auto; min-height: 100vh; }
      main { display: block; overflow: visible; }
      .largura { padding: 0 20px; }
      .palco { padding: 32px 20px 56px; transform: none !important; }
      .inicio, .colunas--2, .colunas--3 { grid-template-columns: 1fr; gap: 40px; }
      .cartas { grid-template-columns: 1fr; justify-items: center; }
      .carta { width: 100%; max-width: 300px; }
    }
    @media (max-width: 560px) {
      .linhas li { grid-template-columns: 1fr; }
      .indice .d { display: none; }
      .indice .t { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>Este site precisa de JavaScript.</noscript>

  <!-- Estrutura comum a todas as páginas -->
  <script type="text/x-template" id="app-template">
    <header class="topo">
      <div class="largura">
        <router-link to="/" class="assinatura">
          <span class="monograma" aria-hidden="true">dd</span>
          <span>{{ perfil.nome }}</span>
        </router-link>
        <nav class="menu" aria-label="Secções">
          <router-link to="/">Início</router-link>
          <router-link to="/quem-sou-eu"><small>01</small>Quem Sou Eu?</router-link>
          <router-link to="/o-que-faco"><small>02</small>O que faço?</router-link>
          <router-link to="/hobbies"><small>03</small>Hobbies</router-link>
        </nav>
      </div>
    </header>

    <main ref="area">
      <div class="palco" ref="palco" :style="{ transform: escala < 1 ? 'scale(' + escala + ')' : null }">
        <router-view v-slot="{ Component }">
          <transition name="pagina" mode="out-in">
            <component :is="Component"></component>
          </transition>
        </router-view>
      </div>
    </main>

    <footer class="rodape">
      <div class="largura">
        <p>© {{ ano }} {{ perfil.nome }} · <a :href="perfil.projeto" target="_blank" rel="noopener">MiniProj1 no GitHub</a></p>
        <div class="redes">
          <a v-for="r in perfil.redes" :key="r.nome" :href="r.url" target="_blank" rel="noopener" :title="r.nome" :aria-label="r.nome">
            <svg :viewBox="icones[r.icone].viewBox" aria-hidden="true"><path :d="icones[r.icone].d"></path></svg>
          </a>
        </div>
      </div>
    </footer>

    <janela-modal></janela-modal>
  </script>

  <script type="text/x-template" id="inicio">
    <section class="inicio">
      <div>
        <img v-if="perfil.foto" :src="perfil.foto" :alt="perfil.nome" class="foto">
        <p class="etiqueta">{{ perfil.etiqueta }}</p>
        <h1 class="nome-grande">
          <span v-for="(parte, i) in partesNome" :key="i">{{ parte }}{{ i === partesNome.length - 1 ? '.' : '' }}</span>
        </h1>
        <p class="lead">{{ perfil.resumo }}</p>
      </div>

      <div>
        <ol class="indice">
          <li>
            <router-link to="/quem-sou-eu">
              <span class="n">01</span><span class="t">Quem Sou Eu?</span><span class="pontos"></span><span class="d">percurso e formação</span>
            </router-link>
          </li>
          <li>
            <router-link to="/o-que-faco">
              <span class="n">02</span><span class="t">O que faço?</span><span class="pontos"></span><span class="d">experiência e competências</span>
            </router-link>
          </li>
          <li>
            <router-link to="/hobbies">
              <span class="n">03</span><span class="t">Hobbies</span><span class="pontos"></span><span class="d">cartas, jogos, motores e código</span>
            </router-link>
          </li>
        </ol>
        <button class="botao" @click="abrirContacto">Contactar</button>
      </div>
    </section>
  </script>

  <script type="text/x-template" id="quem-sou-eu">
    <section>
      <header class="cabeca">
        <span class="num">01</span>
        <h1>Quem Sou Eu?</h1>
      </header>

      <div class="colunas colunas--3">
        <div class="texto">
          <p v-for="(paragrafo, i) in perfil.sobre" :key="i">{{ paragrafo }}</p>
        </div>

        <aside class="ficha">
          <p class="ficha__titulo">Ficha técnica</p>
          <dl>
            <div v-for="d in perfil.dados" :key="d.rotulo">
              <dt>{{ d.rotulo }}</dt>
              <dd>{{ d.valor }}</dd>
            </div>
            <div>
              <dt>email</dt>
              <dd><a :href="'mailto:' + perfil.email">{{ perfil.email }}</a></dd>
            </div>
          </dl>
        </aside>

        <div>
          <h2 class="rotulo">formação</h2>
          <ul class="linhas linhas--empilhadas">
            <li v-for="(f, i) in perfil.formacao" :key="f.curso" :class="{ agora: i === 0 }">
              <span class="datas">{{ f.datas }}</span>
              <strong>{{ f.curso }}</strong>
              <span class="onde">{{ f.escola }}</span>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </script>

  <script type="text/x-template" id="o-que-faco">
    <section>
      <header class="cabeca">
        <span class="num">02</span>
        <h1>O que faço?</h1>
        <p class="lead">{{ perfil.trabalhoAtual }}</p>
      </header>

      <div class="colunas colunas--2">
        <div>
          <h2 class="rotulo">experiência</h2>
          <ul class="linhas">
            <li v-for="(e, i) in perfil.experiencia" :key="e.datas" :class="{ agora: i === 0 }">
              <span class="datas">{{ e.datas }}</span>
              <div>
                <strong>{{ e.cargo }}</strong> <span class="onde">· {{ e.empresa }}</span>
                <p v-if="e.descricao">{{ e.descricao }}</p>
              </div>
            </li>
          </ul>
        </div>

        <div>
          <h2 class="rotulo">competências</h2>
          <dl class="stack">
            <div v-for="c in perfil.competencias" :key="c.tipo">
              <dt>{{ c.tipo }}</dt>
              <dd><code v-for="item in c.itens" :key="item">{{ item }}</code></dd>
            </div>
          </dl>
        </div>
      </div>
    </section>
  </script>

  <script type="text/x-template" id="hobbies">
    <section>
      <header class="cabeca">
        <span class="num">03</span>
        <h1>Hobbies</h1>
        <p class="lead">Quatro cartas do meu baralho. Carrega numa para a leres.</p>
      </header>

      <div class="cartas">
        <button v-for="(h, i) in perfil.hobbies" :key="h.nome" class="carta" :style="{ '--cor': h.cor }" @click="abrir(h)">
          <span class="carta__topo">
            <span>{{ h.nome }}</span>
            <span class="carta__custo">{{ i + 1 }}</span>
          </span>
          <span class="carta__arte">
            <svg v-for="ic in h.icones" :key="ic" :viewBox="icones[ic].viewBox" aria-hidden="true"><path :d="icones[ic].d"></path></svg>
          </span>
          <span class="carta__tipo">Hobby — {{ h.tipo }}</span>
          <span class="carta__texto">{{ h.resumo }}</span>
          <span class="carta__rodape">
            <span>{{ numeroCarta(i) }}</span>
            <span>DD · 2026</span>
          </span>
        </button>
      </div>
    </section>
  </script>

  <script type="text/x-template" id="janela-modal">
    <transition name="modal">
      <div v-if="modal.aberto" class="fundo" @click.self="fechar">
        <div class="janela" :style="{ '--cor': modal.cor }" role="dialog" aria-modal="true" aria-labelledby="titulo-janela">
          <button ref="botaoFechar" class="fechar" aria-label="Fechar" @click="fechar">&times;</button>
          <p v-if="modal.tipo" class="tipo">{{ modal.tipo }}</p>
          <h2 id="titulo-janela">{{ modal.titulo }}</h2>
          <p v-for="(paragrafo, i) in modal.texto" :key="i">{{ paragrafo }}</p>
          <div v-if="modal.links.length" class="acoes">
            <a v-for="(l, i) in modal.links" :key="l.href" :href="l.href" :target="l.href.startsWith('http') ? '_blank' : null" rel="noopener"
               class="botao" :class="{ 'botao--linha': i > 0 }">
              <svg :viewBox="icones[l.icone].viewBox" aria-hidden="true"><path :d="icones[l.icone].d"></path></svg>
              {{ l.texto }}
            </a>
          </div>
        </div>
      </div>
    </transition>
  </script>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

  <script>

    // Janela modal, partilhada por todas as páginas
    const modal = reactive({ aberto: false, titulo: '', tipo: '', texto: [], links: [], cor: '' });
    let focoAnterior = null;

    function abrirModal({ titulo, tipo = '', texto = [], links = [], cor = '' }) {
      focoAnterior = document.activeElement;
      Object.assign(modal, { titulo, tipo, texto, links, cor, aberto: true });
    }

    function fecharModal() {
      modal.aberto = false;
      if (focoAnterior) focoAnterior.focus();
    }

    function abrirContacto() {
      const linkedin = perfil.redes.find(r => r.icone === 'linkedin');
      abrirModal({
        titulo: 'Contactar',
        texto: ['O email é a forma mais rápida de falar comigo. Também estou no LinkedIn.'],
        links: [
          { texto: perfil.email, href: 'mailto:' + perfil.email, icone: 'email' },
          { texto: 'LinkedIn', href: linkedin.url, icone: 'linkedin' }
        ]
      });
    }

    // Páginas
    const Inicio = {
      template: '#inicio',
      setup: () => ({ perfil, partesNome: perfil.nome.split(' '), abrirContacto })
    };

    const QuemSouEu = {
      template: '#quem-sou-eu',
      setup: () => ({ perfil })
    };

    const OQueFaco = {
      template: '#o-que-faco',
      setup: () => ({ perfil })
    };

    const Hobbies = {
      template: '#hobbies',
      setup() {
        const total = String(perfil.hobbies.length).padStart(3, '0');
        const numeroCarta = i => String(i + 1).padStart(3, '0') + '/' + total;
        const abrir = h => abrirModal({ titulo: h.nome, tipo: 'Hobby — ' + h.tipo, texto: h.detalhe, cor: h.cor });
        return { perfil, icones, numeroCarta, abrir };
      }
    };

    const JanelaModal = {
      template: '#janela-modal',
      setup() {
        const botaoFechar = ref(null);

        function tecla(e) {
          if (e.key === 'Escape' && modal.aberto) fecharModal();
        }

        watch(() => modal.aberto, aberto => {
          document.body.style.overflow = aberto ? 'hidden' : '';
          if (aberto) nextTick(() => botaoFechar.value.focus());
        });

        onMounted(() => document.addEventListener('keydown', tecla));
        onUnmounted(() => document.removeEventListener('keydown', tecla));

        return { modal, icones, fechar: fecharModal, botaoFechar };
      }
    };

    // Rotas. Com o modo hash os endereços ficam index.html#/hobbies, etc.,
    // e a página nunca é recarregada ao navegar.
    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/', component: Inicio, meta: { titulo: 'Início' } },
        { path: '/quem-sou-eu', component: QuemSouEu, meta: { titulo: 'Quem Sou Eu?' } },
        { path: '/o-que-faco', component: OQueFaco, meta: { titulo: 'O que faço?' } },
        { path: '/hobbies', component: Hobbies, meta: { titulo: 'Hobbies' } },
        { path: '/:pathMatch(.*)*', redirect: '/' }
      ],
      scrollBehavior() {
        return { top: 0 };
      }
    });

    router.afterEach(to => {
      document.title = to.meta.titulo + ' — ' + perfil.nome;
    });

    const app = createApp({
      template: '#app-template',
      setup() {
        const area = ref(null);
        const palco = ref(null);
        const escala = ref(1);
        const telemovel = window.matchMedia('(max-width: 760px)');

        // Se o conteúdo for mais alto do que o espaço entre o cabeçalho e o
        // rodapé, reduz-se à escala certa para nunca haver scroll vertical.
        // No telemóvel a página faz scroll normalmente.
        function ajustar() {
          if (!area.value || !palco.value || telemovel.matches) {
            escala.value = 1;
            return;
          }
          const disponivel = area.value.clientHeight;
          const conteudo = palco.value.offsetHeight;
          escala.value = Math.min(1, disponivel / conteudo);
        }

        let observador;
        onMounted(() => {
          observador = new ResizeObserver(ajustar);
          observador.observe(area.value);
          observador.observe(palco.value);
          document.fonts.ready.then(ajustar);
        });
        onUnmounted(() => observador.disconnect());

        return { perfil, icones, area, palco, escala, ano: new Date().getFullYear() };
      }
    });

    app.component('janela-modal', JanelaModal);
    app.use(router);
    app.mount('#app');
